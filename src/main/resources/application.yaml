spring:
  application:
    name: library-web
  datasource:
    url: "jdbc:postgresql://localhost:5432/t_library?currentSchema=test"
    username: tester
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: test
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

jwt:
  key: ${JWT_KEY}
  access-token-expiration: 3600000
  refresh-token-expiration: 1296000000